<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pi visual</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col">
  <header class="flex items-center justify-between px-4 py-2 border-b border-zinc-800 bg-zinc-900/80 backdrop-blur sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <span class="text-lg font-semibold text-zinc-100">pi visual</span>
      <span id="status-indicator" class="text-xs text-zinc-500">Connecting...</span>
    </div>
    <button id="toggle-tools-btn" class="text-xs text-zinc-400 hover:text-zinc-200 px-2.5 py-1 rounded-md border border-zinc-700 hover:border-zinc-500 bg-zinc-800/50 transition-colors">Collapse Tools</button>
  </header>
  <main id="chat-container" class="flex-1 overflow-y-auto px-4 py-6 space-y-4 max-w-4xl w-full mx-auto">
    <div id="empty-state" class="flex items-center justify-center h-64 text-zinc-600 text-sm">
      Send a message to start chatting...
    </div>
  </main>
  <div id="status-bar" class="border-t border-zinc-800 bg-zinc-900 px-4 py-1.5 flex items-center gap-4 text-xs text-zinc-500 shrink-0">
    <div class="max-w-4xl w-full mx-auto flex items-center gap-4">
      <span id="status-connection" class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-zinc-600"></span>disconnected</span>
      <span id="status-model" class="truncate"></span>
      <span id="status-cwd" class="truncate hidden sm:inline"></span>
      <span id="status-session" class="ml-auto hidden sm:inline text-zinc-600"></span>
    </div>
  </div>
  <footer class="border-t border-zinc-800 bg-zinc-900/80 backdrop-blur px-4 py-3 sticky bottom-0 relative">
    <div class="max-w-4xl mx-auto">
      <!-- Drop zone overlay -->
      <div id="drop-overlay" class="hidden absolute inset-0 bg-blue-500/10 border-2 border-dashed border-blue-400 rounded-lg z-10 flex items-center justify-center pointer-events-none">
        <span class="text-blue-300 text-sm font-medium">Drop image here</span>
      </div>
      <div class="flex gap-2 items-end relative">
        <div id="autocomplete-dropdown" class="hidden absolute bottom-full left-0 right-16 mb-1 bg-zinc-800 border border-zinc-700 rounded-lg shadow-xl max-h-64 overflow-y-auto z-50">
        </div>
        <div class="flex-1 relative">
          <textarea id="text-input" rows="1" placeholder="Type a message or paste/drop an image..."
            class="w-full bg-zinc-800 text-zinc-100 rounded-lg px-3 py-2 pr-16 text-sm resize-none border border-zinc-700 focus:border-blue-500 focus:outline-none placeholder-zinc-500"></textarea>
          <div class="absolute right-2 bottom-1.5 flex items-center gap-1">
            <button id="upload-btn" class="text-zinc-500 hover:text-zinc-300 text-sm p-0.5" title="Upload image">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
            <input type="file" id="file-input" accept="image/*" class="hidden">
          </div>
        </div>
        <button id="send-btn" class="bg-blue-600 hover:bg-blue-500 text-white rounded-lg px-4 py-2 text-sm font-medium transition-colors self-end">
          Send
        </button>
      </div>
      <div id="image-preview" class="mt-2 hidden">
        <div class="inline-flex items-center gap-2 bg-zinc-800 rounded-lg px-3 py-1.5 text-xs text-zinc-400">
          <span id="preview-filename">image.png</span>
          <button id="remove-image" class="text-zinc-500 hover:text-red-400">✕</button>
        </div>
      </div>
    </div>
  </footer>
  <div id="reconnect-overlay" class="hidden fixed inset-0 bg-zinc-950/80 flex items-center justify-center z-[100]">
    <div class="text-center">
      <div class="animate-spin text-4xl mb-4">⟳</div>
      <p class="text-zinc-400 text-sm">Reconnecting to pi...</p>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
